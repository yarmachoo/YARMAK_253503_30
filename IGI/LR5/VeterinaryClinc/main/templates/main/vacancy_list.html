{% extends 'main/layout.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'main/css/vacancy.css' %}">
<h2>Список вакансий</h2>
<div class="clearfix">
    {% for vacancy in object_list %}
    <div class="vacancy">
        <h3>{{ vacancy.title }}</h3>
        <p>{{ vacancy.description }}</p>
        <a href="{% url 'vacancy-detail' vacancy.id %}" class="btn btn-primary">Подробнее</a>
    </div>
    {% endfor %}
</div>
{% endblock %}

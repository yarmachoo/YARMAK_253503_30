{% extends 'main/layout.html' %}
{% load static %}
{% block content %}
<title>Сотрудники учреждения</title>
</head>
<body>
  <h1>Добавление сотрудников</h1>
  <form id="employeeForm">
    <label for="firstName">Имя:</label>
    <input type="text" id="firstName" required />
    <br />
    <label for="lastName">Фамилия:</label>
    <input type="text" id="lastName" required />
    <br />
    <label for="patronymic">Отчество:</label>
    <input type="text" id="patronymic" />
    <br />
    <label for="gender">Пол:</label>
    <select id="gender">
      <option value="male">Мужской</option>
      <option value="female">Женский</option>
    </select>
    <br />
    <label for="experience">Стаж работы:</label>
    <input type="number" id="experience" required />
    <br />
    <button type="submit">Добавить сотрудника</button>
  </form>

  <h2>Список сотрудников:</h2>
  <ul id="employeeList"></ul>

  <h3>Самые популярные имена:</h3>
  <p id="mostCommonMaleName">Мужские имена: </p>
  <p id="mostCommonFemaleName">Женские имена: </p>

<script src="{% static 'main/js/task_7_prototype.js'%}"></script>
{% endblock %}
